name: Publish TechDocs

permissions:
  contents: read

on:
  push:
    branches: [ test, main ]
    paths:
      - "documentation/**"
      - "mkdocs.yml"
      - "catalog-info.yaml"
      - "scripts/**"
      - ".github/workflows/publish-techdocs.yaml"
  pull_request:
    branches: [ test, main ]
    paths:
      - "documentation/**"
      - "mkdocs.yml"
      - "catalog-info.yaml"
      - "scripts/**"
      - ".github/workflows/publish-techdocs.yaml"
  workflow_dispatch:
    inputs:
      deploy_location:
        description: "Publish to dev (DevHub Dev/Test) or prod (root and dev)"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

jobs:
  publish-techdocs-site:
    runs-on: ubuntu-latest
    name: Build and publish techdocs
    # Production also writes to dev, so serialize all publishing for this project.
    concurrency:
      group: techdocs-aps-infra-platform-docs-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish' }}
      cancel-in-progress: false
    env:
      # A manual destination takes precedence over the selected branch.
      DEPLOY_ENV: ${{ ((github.event_name == 'workflow_dispatch' && inputs.deploy_location == 'prod') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'prod' || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set base URL
        run: |
          if [[ "$DEPLOY_ENV" == "prod" ]]; then
            echo "DOCS_URL=https://developer.gov.bc.ca/docs/default/component/aps-infra-platform-docs" >> "$GITHUB_ENV"
          else
            echo "DOCS_URL=https://dev.developer.gov.bc.ca/docs/default/component/aps-infra-platform-docs" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.10"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run python Script
        run: python scripts/sub_glossary.py

      - name: Validate pull request without publishing
        if: github.event_name == 'pull_request'
        uses: bcgov/devhub-techdocs-publish@stable
        with:
          publish: 'false'

      - name: Build and publish TechDocs
        if: github.event_name != 'pull_request'
        uses: bcgov/devhub-techdocs-publish@stable
        with:
          publish: 'true'
          production: ${{ env.DEPLOY_ENV == 'prod' && 'true' || 'false' }}
          bucket_name: ${{ secrets.TECHDOCS_S3_BUCKET_NAME }}
          s3_access_key_id: ${{ secrets.TECHDOCS_AWS_ACCESS_KEY_ID }}
          s3_secret_access_key: ${{ secrets.TECHDOCS_AWS_SECRET_ACCESS_KEY }}
          s3_region: ${{ secrets.TECHDOCS_AWS_REGION }}
          s3_endpoint: ${{ secrets.TECHDOCS_AWS_ENDPOINT }}
